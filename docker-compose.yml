# FORKY - single-host production stack.
#   cp deploy/.env.example deploy/.env      (edit every value)
#   cp backend/.env.production.example backend/.env.production   (edit every value)
#   docker compose --env-file deploy/.env up -d --build      (db -> migrate (schema) -> api -> web)
#   first run only, create the Super Admin:   docker compose --env-file deploy/.env run --rm --no-deps api node dist/database/seed
#   full guide: docs/deployment.md
# TLS: enable the "proxy" profile (Caddy gets certificates automatically):  docker compose --profile proxy up -d
# Settings shared by the API and the one-shot migrate service (same image, same environment).
x-api-base: &api-base
  build:
    context: ./backend
    args:
      GIT_SHA: ${GIT_SHA:-}
  image: forky-api:latest
  env_file: backend/.env.production
  environment:
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: ${DB_USER:-forky}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME:-forky}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-forky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: ${DB_NAME:-forky}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-forky} -d ${DB_NAME:-forky}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies pending database migrations, then exits. The API starts only after it succeeded.
  # Also the way to run one-off commands with the API image:  docker compose run --rm --no-deps api node dist/database/seed
  migrate:
    <<: *api-base
    restart: "no"
    command: ["node", "dist/database/migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-base
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - private-uploads:/app/private-uploads
    expose:
      - "4000"

  web:
    build:
      context: ./admin
      args:
        REACT_APP_API_URL: https://${API_DOMAIN:?set API_DOMAIN}/api/v1
        REACT_APP_WS_URL: https://${API_DOMAIN}
        REACT_APP_CSP_CONNECT: https://${API_DOMAIN} wss://${API_DOMAIN} https://api.stripe.com https://m.stripe.network https://r.stripe.com
        REACT_APP_CSP_IMG: https://${API_DOMAIN} https://*.stripe.com
        REACT_APP_CSP_SCRIPT: https://js.stripe.com
        REACT_APP_CSP_FRAME: https://js.stripe.com https://hooks.stripe.com
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy.d:/etc/caddy/caddy.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  dbdata:
  uploads:
  private-uploads:
  caddy_data:
  caddy_config:
