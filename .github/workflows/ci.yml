name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The production schema comes from migrations, so they must exactly match the entities: apply them to an empty database and
  # fail if TypeORM still sees a difference. Fix: npm run migration:generate -- src/database/migrations/<Name>  (commit the file)
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forky"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: forky
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply all migrations to an empty database
        run: npm run migration:run
      - name: Entities and migrations must agree
        run: npm run migration:check

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      DISABLE_ESLINT_PLUGIN: "true"
      GENERATE_SOURCEMAP: "false"
      REACT_APP_API_URL: http://localhost:4000/api/v1
      REACT_APP_WS_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t forky-api ./backend
      - name: Build web image
        run: docker build -t forky-web --build-arg REACT_APP_API_URL=https://api.example.ca/api/v1 --build-arg REACT_APP_WS_URL=https://api.example.ca ./admin

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
