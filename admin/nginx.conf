# Static hosting for the React apps with the headers a meta tag cannot set.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # headers that cannot be sent from a <meta> CSP (keep in sync with docs/security-frontend.md)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(self)" always;
  # enable once the site is served over HTTPS only (the TLS proxy in front can also add it):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # hashed build assets never change: cache for a year; the HTML shell and the service worker must always be revalidated
  location /static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location = /site.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; }

  # single page apps: admin (/), portal (/portal), customer website (/order)
  location / { try_files $uri $uri/ /index.html; }
}
