  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org %REACT_APP_CSP_IMG%; font-src 'self' data:; connect-src 'self' %REACT_APP_CSP_CONNECT%; media-src 'self' blob: %REACT_APP_CSP_IMG%; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'" />
